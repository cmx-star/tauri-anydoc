[package]
name = "anydoc-desktop"
version = "0.1.3"
description = "Universal Document to Markdown Converter based on anydoc"
authors = ["codex"]
edition = "2021"

[lib]
name = "anydoc_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anydoc = "0.2.4"
walkdir = "2"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
